name: Capture English screenshot once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-english-screenshot.yml']
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Render and validate the real English UI
        shell: pwsh
        run: |
          dotnet run --project tests/ThunderbirdAccounts.UiTests -c Release -- artifacts/ui-preview
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed.' }
      - name: Commit the screenshot only
        shell: pwsh
        run: |
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not check main.' }
          if ((git rev-parse origin/main) -ne $env:GITHUB_SHA) { throw 'Main changed; refusing to publish a stale screenshot.' }
          New-Item -ItemType Directory -Force docs/images | Out-Null
          Copy-Item artifacts/ui-preview/overview-en.png docs/images/overview-en.png
          git add -- docs/images/overview-en.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Could not compare screenshot.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add real English app screenshot [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit screenshot.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not push screenshot.' }
